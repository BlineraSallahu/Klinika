<div class="min-h-screen flex flex-column bg-gray-50 font-sans">


  <!-- HEADER / NAVIGIMI (Klinika Olive) -->
  <header class="bg-primary text-white p-3 flex justify-content-between align-items-center shadow-2">
    <div class="flex align-items-center gap-2">
      <i class="pi pi-heart-fill text-2xl text-red-400"></i>
      <span class="text-xl font-bold tracking-wide">Klinika Olive</span>
    </div>
    <nav class="flex gap-4 align-items-center">
      <a class="text-white no-underline font-medium hover:text-blue-200 cursor-pointer">Ballina</a>
      <a class="text-white no-underline font-medium hover:text-blue-200 cursor-pointer">Terminet</a>
      <p-button label="Kyçu" icon="pi pi-sign-in" severity="secondary" [text]="true" styleClass="text-white"></p-button>
    </nav>
  </header>


  <!-- PJESA KRYESORE / FORMULARI DHE TABELA -->
  <main class="flex-1 flex flex-column align-items-center gap-5 p-4">
    
    <!-- Formular i bërë nga ti -->
    <div class="surface-card p-5 shadow-2 border-round-xl w-full max-w-30rem">
      <div class="text-center mb-4">
        <i class="pi pi-user-plus text-primary text-4xl mb-2"></i>
        <h3 class="text-2xl font-bold text-900 m-0">Regjistro Pacient të Ri</h3>
        <p class="text-500 mt-1">Plotësoni të dhënat për klinikën Olive</p>
      </div>
      
      <div class="flex flex-column gap-3">
        <div class="flex flex-column gap-2">
          <label class="font-medium text-700">Emri dhe Mbiemri</label>
          <input pInputText placeholder="Arientina Miftari" class="w-full" />
        </div>


        <div class="flex flex-column gap-2">
          <label class="font-medium text-700">Numri i Telefonit</label>
          <input pInputText placeholder="+383 44 111 222" class="w-full" />
        </div>


        <div class="flex flex-column gap-2">
          <label class="font-medium text-700">Data e Lindjes</label>
          <p-datepicker placeholder="Zgjidh datën" styleClass="w-full"></p-datepicker>
        </div>


        <p-button label="Ruaj Pacientin" icon="pi pi-save" severity="success" class="mt-2 w-full" styleClass="w-full"></p-button>
      </div>
    </div>


    <!-- Tabela e shtuar nga Shoqja (Sipas v19) -->
    <div class="surface-card p-4 shadow-2 border-round-xl w-full max-w-50rem mb-5">
      <div class="flex align-items-center gap-2 mb-4">
        <i class="pi pi-list text-primary text-2xl"></i>
        <h3 class="text-xl font-bold text-900 m-0">Lista e Termineve të Klinikës Olive</h3>
      </div>


      <p-table [value]="pacientet" [tableStyle]="{ 'min-w': '100%' }">
        <ng-template pTemplate="header">
          <tr>
            <th class="bg-gray-100 text-700 font-semibold p-3 text-left">Pacienti</th>
            <th class="bg-gray-100 text-700 font-semibold p-3 text-left">Mjeku Ortoped/Pediatr</th>
            <th class="bg-gray-100 text-700 font-semibold p-3 text-left">Data e Terminit</th>
            <th class="bg-gray-100 text-700 font-semibold p-3 text-center">Statusi</th>
          </tr>
        </ng-template>
        
        <ng-template pTemplate="body" let-pacient>
          <tr class="border-bottom-1 border-200 hover:bg-gray-50 transition-colors duration-150">
            <td class="font-semibold text-900 p-3 text-left">{{ pacient.emri }}</td>
            <td class="text-600 p-3 text-left">{{ pacient.mjeku }}</td>
            <td class="text-600 p-3 text-left">{{ pacient.data }}</td>
            <td class="p-3 text-center">
              <span [className]="'px-3 py-1 border-round-md font-medium text-xs ' + pacient.klasaStatusi">
                {{ pacient.status }}
              </span>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>


  </main>


</div>
